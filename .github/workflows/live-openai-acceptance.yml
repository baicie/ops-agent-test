name: Live Docker and OpenAI acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-openai-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance:
    name: Real incident investigation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: release
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the release branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.88"

      - name: Test the evidence verifier
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Build release binary
        run: cargo build --locked --release

      - name: Run live Docker and OpenAI acceptance
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPSCODEX_ACCEPTANCE_ARTIFACT_DIR: ${{ runner.temp }}/opscodex-live-acceptance
          OPSCODEX_MODEL: gpt-5.2
        run: bash scripts/live_openai_acceptance.sh

      - name: Stop demo containers
        if: always()
        run: >-
          docker compose -f demo/docker-compose.yml down
          --volumes --remove-orphans

      - name: Upload sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-openai-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/opscodex-live-acceptance
          if-no-files-found: error
          retention-days: 30
