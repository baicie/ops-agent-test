[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
ignore = []

[licenses]
# Keep the global allowlist permissive-only. Any copyleft dependency requires a
# reviewed, crate-specific exception rather than a broad policy change.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = []

[licenses.private]
ignore = false

[bans]
# Duplicate transitive versions are an actionable maintenance signal, but can
# be unavoidable until upstream crates converge.
multiple-versions = "warn"
wildcards = "deny"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
