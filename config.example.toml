[model]
provider = "openai"
model = "gpt-5.2"
api_key_env = "OPENAI_API_KEY"
endpoint = "https://api.openai.com/v1/responses"
# reasoning_effort = "none"

[runtime]
max_steps = 12
max_concurrent_turns = 4
tool_timeout_seconds = 30
model_timeout_seconds = 120
max_output_bytes = 65536
context_items = 100
context_max_tokens = 24000
context_max_bytes = 96000
context_max_evidence = 32
context_max_tool_calls = 24
inline_artifact_bytes = 8192

[prometheus]
url = "http://localhost:9090"

[loki]
url = "http://localhost:3100"
tenant_header = "X-Scope-OrgID"
tenant_env = "LOKI_TENANT"
max_range_seconds = 3600
max_lines = 200

[tempo]
url = "http://localhost:3200"
max_range_seconds = 3600

[targets]
allowed_containers = ["order-service"]
allowed_hosts = ["localhost", "127.0.0.1", "order-service"]

# Optional explicit workspaces. If omitted, the top-level prometheus/loki/tempo/targets
# settings become the implicit `default` workspace. Credentials are environment variable
# names only; never put kubeconfig tokens or API keys in this file.
# [[workspaces]]
# id = "staging"
# display_name = "Staging"
# environment = "staging"
# kubeconfig_env = "STAGING_KUBECONFIG"
# cluster_alias = "staging"
# allowed_namespaces = ["checkout"]
# runbook_dir = "runbooks"

[tools]
exec = false

# Extensions are discovered from local files only. Installation is not exposed
# through the unauthenticated Web API. production_safe disables Custom Tool and
# stdio MCP, and cannot be combined with tools.exec. HTTP MCP still requires an
# explicit host allowlist and TLS.
[extensions]
production_safe = false
allow_custom_tools = false
max_skill_context_bytes = 4096

# [[extension]]
# id = "acme-status"
# kind = "custom"          # custom | mcp | mcp_http
# trusted_local = true
# path = "/absolute/path/tool.yaml"
# effect = "observe"
# recovery = "none_needed"

# [[skills]]
# path = "skills/db-pool"
# workspaces = ["default"]

# Without TLS, host must be loopback (127.0.0.1, localhost, or ::1).
# Binding 0.0.0.0 is rejected.
[server]
host = "127.0.0.1"
port = 3000

# SQLite is the default event store from v0.5. Keep JSONL as a migration source
# and export format. Multiple OpsCodex processes cannot share one SQLite file.
[store]
backend = "sqlite"
approval_ttl_seconds = 3600
lease_ttl_seconds = 30

# Remediation is off by default. Enabling it still requires per-workspace
# allow_remediation, an exact request-hash approval, and does not auto-rollback.
[remediation]
enabled = false
kill_switch = false
demo_fault_url = "http://127.0.0.1:8080"
approval_ttl_seconds = 1800

